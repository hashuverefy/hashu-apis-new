<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>Hashu Hub — Songs, Games & Movies</title>
<meta name="description" content="Search YouTube songs, FitGirl repacks and CineSubz movies in one place.">
<style>
  :root{
    --bg:#0b0b12; --bg2:#12121c; --card:#171726; --card2:#1d1d30;
    --line:rgba(255,255,255,.08); --text:#f2f2f8; --muted:#9a9ab2;
    --accent:#8b5cf6; --accent2:#ec4899; --ok:#34d399; --err:#f87171;
    --yt:#ff3d4d; --fg:#f59e0b; --cs:#38bdf8;
    --r:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Sinhala",sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;
    padding-bottom:env(safe-area-inset-bottom);
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(600px 400px at 10% -5%,rgba(139,92,246,.28),transparent 60%),
      radial-gradient(500px 380px at 95% 5%,rgba(236,72,153,.2),transparent 60%);
  }
  .wrap{max-width:860px;margin:0 auto;padding:0 16px 80px}

  header{padding:34px 0 20px;text-align:center}
  .logo{
    display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:1.7rem;letter-spacing:-.02em;
  }
  .logo i{
    width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-size:1.2rem;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 8px 24px rgba(139,92,246,.45);
  }
  .logo span{background:linear-gradient(90deg,#fff,#c9b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{color:var(--muted);font-size:.95rem;margin-top:6px}

  /* tabs */
  .tabs{
    display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;border-radius:16px;
    background:var(--bg2);border:1px solid var(--line);position:sticky;top:10px;z-index:20;
    backdrop-filter:blur(14px);
  }
  .tab{
    border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:.92rem;
    padding:11px 6px;border-radius:12px;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:7px;
  }
  .tab:hover{color:var(--text)}
  .tab.active{color:#fff;background:var(--card2);box-shadow:inset 0 0 0 1px var(--line)}
  .tab .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}

  /* search */
  .search{
    margin:18px 0 8px;display:flex;gap:8px;padding:6px;border-radius:18px;
    background:var(--card);border:1px solid var(--line);transition:.2s;
  }
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px rgba(139,92,246,.18)}
  .search input{
    flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--text);font:inherit;font-size:1rem;padding:12px 12px;
  }
  .search input::placeholder{color:#6c6c85}
  .btn{
    border:0;cursor:pointer;font:inherit;font-weight:700;color:#fff;border-radius:13px;padding:0 20px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));transition:.2s;
  }
  .btn:hover{filter:brightness(1.1)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.55;cursor:wait}
  .hint{color:var(--muted);font-size:.82rem;padding:0 6px 6px}

  /* results */
  #out{margin-top:14px;display:grid;gap:12px}
  .card{
    display:flex;gap:14px;align-items:center;padding:12px;border-radius:var(--r);
    background:var(--card);border:1px solid var(--line);transition:.2s;animation:in .35s both;
  }
  .card:hover{border-color:rgba(139,92,246,.45);transform:translateY(-1px)}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .thumb{
    width:112px;aspect-ratio:16/9;border-radius:12px;object-fit:cover;background:var(--card2);flex:none;
  }
  .meta{flex:1;min-width:0}
  .title{font-weight:650;font-size:.98rem;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
  .sub{color:var(--muted);font-size:.8rem;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .pill{
    border:1px solid var(--line);background:var(--card2);color:var(--text);font:inherit;font-size:.82rem;font-weight:600;
    padding:8px 14px;border-radius:999px;cursor:pointer;text-decoration:none;transition:.2s;display:inline-flex;align-items:center;gap:6px;
  }
  .pill:hover{border-color:var(--accent);color:#fff}
  .pill.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff}
  .pill:disabled{opacity:.6;cursor:wait}
  .player{grid-column:1/-1;width:100%;margin-top:10px}
  .player audio{width:100%;height:42px;border-radius:12px;color-scheme:dark}
  .cardcol{flex-direction:column;align-items:stretch}
  .row{display:flex;gap:14px;align-items:center}

  /* detail */
  .detail{
    padding:20px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);animation:in .35s both;
  }
  .detail h2{font-size:1.15rem;line-height:1.35;margin-bottom:8px}
  .detail p{color:var(--muted);font-size:.9rem;white-space:pre-line}
  .detail h3{margin:18px 0 10px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .links{display:grid;gap:8px}
  .link{
    display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:13px;
    background:var(--card2);border:1px solid var(--line);text-decoration:none;color:var(--text);font-size:.9rem;transition:.2s;
  }
  .link:hover{border-color:var(--accent)}
  .link b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .link small{color:var(--muted);flex:none}
  .back{margin-bottom:12px}

  /* states */
  .state{
    text-align:center;color:var(--muted);padding:44px 16px;border:1px dashed var(--line);border-radius:var(--r);
  }
  .state .big{font-size:2rem;margin-bottom:6px}
  .state.err{color:var(--err);border-color:rgba(248,113,113,.35);background:rgba(248,113,113,.05)}
  .skel{height:92px;border-radius:var(--r);border:1px solid var(--line);
    background:linear-gradient(100deg,var(--card) 30%,var(--card2) 50%,var(--card) 70%);background-size:200% 100%;animation:sh 1.2s infinite linear}
  @keyframes sh{to{background-position:-200% 0}}

  .toast{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;
    background:#26263d;border:1px solid var(--line);color:var(--text);padding:11px 18px;border-radius:999px;font-size:.88rem;
    transition:.25s;pointer-events:none;z-index:50;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  footer{text-align:center;color:#5d5d75;font-size:.78rem;margin-top:40px}

  @media (max-width:520px){
    .thumb{width:96px}
    .tab{font-size:.84rem;padding:10px 4px}
    .tab .dot{display:none}
    .btn{padding:0 16px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><i>♪</i><span>Hashu Hub</span></div>
    <p>Songs, games & movies — one search away</p>
  </header>

  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab active" data-site="youtube" style="--c:var(--yt)"><span class="dot"></span>YouTube</button>
    <button class="tab" data-site="fitgirl" style="--c:var(--fg)"><span class="dot"></span>FitGirl</button>
    <button class="tab" data-site="cinesubz" style="--c:var(--cs)"><span class="dot"></span>CineSubz</button>
  </nav>

  <form class="search" id="form" autocomplete="off">
    <input id="q" type="search" enterkeyhint="search" placeholder="Search a song…" aria-label="Search" required>
    <button class="btn" id="go" type="submit">Search</button>
  </form>
  <div class="hint" id="hint">Pick a song, then tap <b>MP3</b> to get the download link.</div>

  <main id="out"></main>
  <footer>Hashu Hub · powered by your Vercel API</footer>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const API = '/api/search';
  const $ = s => document.querySelector(s);
  const out = $('#out'), form = $('#form'), q = $('#q'), go = $('#go'), hint = $('#hint');
  let site = 'youtube';
  let lastResults = null;      // remembered so "Back" works on detail view
  let reqId = 0;               // ignore stale responses

  const META = {
    youtube:  { ph:'Search a song…',          hint:'Pick a song, then tap <b>MP3</b> to get the download link.' },
    fitgirl:  { ph:'Search a game…',          hint:'Open a result to see its direct / magnet links.' },
    cinesubz: { ph:'Search a movie…',         hint:'Open a result to see download links.' }
  };

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeUrl = u => /^(https?:|magnet:)/i.test(u) ? u : '#';

  function toast(msg){
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1900);
  }
  async function copy(text){
    try{ await navigator.clipboard.writeText(text); toast('Link copied'); }
    catch{
      const a = document.createElement('textarea'); a.value = text; document.body.appendChild(a); a.select();
      try{ document.execCommand('copy'); toast('Link copied'); }catch{ toast('Copy failed'); }
      a.remove();
    }
  }

  async function api(params){
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 45000);
    try{
      const res = await fetch(API + '?' + new URLSearchParams(params), { signal: ctrl.signal });
      let data = null;
      try{ data = await res.json(); }catch{}
      if(!res.ok){
        const msg = data?.message || data?.details || data?.error || ('Request failed (' + res.status + ')');
        throw new Error(msg);
      }
      return data;
    }catch(e){
      if(e.name === 'AbortError') throw new Error('Timed out — the server took too long.');
      throw e;
    }finally{ clearTimeout(timer); }
  }

  /* ---------- renderers ---------- */
  const skeleton = () => out.innerHTML = '<div class="skel"></div>'.repeat(4);
  const state = (icon, text, err) => out.innerHTML = `<div class="state ${err?'err':''}"><div class="big">${icon}</div>${esc(text)}</div>`;

  function renderYouTube(items){
    out.innerHTML = '';
    items.forEach((it, i) => {
      const el = document.createElement('div');
      el.className = 'card cardcol'; el.style.animationDelay = (i*60) + 'ms';
      const thumb = it.videoId ? `https://i.ytimg.com/vi/${encodeURIComponent(it.videoId)}/hqdefault.jpg` : (it.thumbnail || '');
      el.innerHTML = `
        <div class="row">
          <img class="thumb" loading="lazy" src="${esc(thumb)}" alt="">
          <div class="meta">
            <div class="title">${esc(it.title)}</div>
            <div class="sub">youtube.com/watch?v=${esc(it.videoId)}</div>
            <div class="actions">
              <button class="pill primary" data-act="mp3">⬇ MP3</button>
              <a class="pill" href="${esc(safeUrl(it.url))}" target="_blank" rel="noopener">▶ Watch</a>
            </div>
          </div>
        </div>
        <div class="player" hidden></div>`;
      const btn = el.querySelector('[data-act=mp3]'), box = el.querySelector('.player');
      btn.addEventListener('click', async () => {
        btn.disabled = true; btn.textContent = 'Preparing…';
        try{
          const d = await api({ site:'youtube', id: it.videoId });
          if(!d.download_url) throw new Error('No download link returned');
          box.hidden = false;
          box.innerHTML = `
            <audio controls preload="none" src="${esc(safeUrl(d.download_url))}"></audio>
            <div class="actions">
              <a class="pill primary" href="${esc(safeUrl(d.download_url))}" target="_blank" rel="noopener" download>⬇ Download</a>
              <button class="pill" data-copy>Copy link</button>
            </div>`;
          box.querySelector('[data-copy]').onclick = () => copy(d.download_url);
          btn.textContent = '✓ Ready';
        }catch(e){
          btn.disabled = false; btn.textContent = '⬇ MP3'; toast(e.message.slice(0,90));
          box.hidden = false; box.innerHTML = `<div class="sub" style="color:var(--err);white-space:normal">${esc(e.message)}</div>`;
        }
      });
      out.appendChild(el);
    });
  }

  function renderPosts(items){
    out.innerHTML = '';
    items.forEach((it, i) => {
      const el = document.createElement('div');
      el.className = 'card'; el.style.animationDelay = (i*60) + 'ms';
      let host = ''; try{ host = new URL(it.link).hostname; }catch{}
      el.innerHTML = `
        <div class="meta">
          <div class="title">${esc(it.title)}</div>
          <div class="sub">${esc(host)}</div>
          <div class="actions">
            <button class="pill primary">View links</button>
            <button class="pill" data-copy>Copy page</button>
          </div>
        </div>`;
      el.querySelector('.primary').onclick = () => openDetail(it);
      el.querySelector('[data-copy]').onclick = () => copy(it.link);
      out.appendChild(el);
    });
  }

  async function openDetail(it){
    skeleton(); window.scrollTo({ top: 0, behavior:'smooth' });
    const my = ++reqId, s = site;
    try{
      const d = await api({ site: s, url: it.link });
      if(my !== reqId) return;
      const links = d.direct_download_links || [];
      out.innerHTML = `
        <div><button class="pill back">← Back to results</button></div>
        <div class="detail">
          <h2>${esc(d.title || it.title)}</h2>
          <p>${esc(d.description || 'No description available.')}</p>
          <h3>Download links (${links.length})</h3>
          <div class="links">${
            links.length ? links.map((l,i) => `
              <a class="link" href="${esc(safeUrl(l.url))}" target="_blank" rel="noopener noreferrer">
                <b>${esc(l.text)}</b><small>${esc(hostOf(l.url))} ↗</small>
              </a>`).join('')
            : '<div class="state" style="padding:24px">No direct links found on this page.</div>'
          }</div>
        </div>`;
      out.querySelector('.back').onclick = () => lastResults ? renderPosts(lastResults) : null;
    }catch(e){
      if(my !== reqId) return;
      state('⚠️', e.message, true);
    }
  }
  const hostOf = u => { if(/^magnet:/i.test(u)) return 'magnet'; try{ return new URL(u).hostname.replace(/^www\./,''); }catch{ return ''; } };

  /* ---------- search ---------- */
  async function search(){
    const text = q.value.trim(); if(!text) return;
    const my = ++reqId, s = site;
    go.disabled = true; go.textContent = '…'; skeleton();
    try{
      const d = await api({ site: s, q: text });
      if(my !== reqId) return;
      const items = d.results || [];
      if(!items.length) return state('🔍', 'No results found. Try different words.');
      lastResults = items;
      s === 'youtube' ? renderYouTube(items) : renderPosts(items);
    }catch(e){
      if(my !== reqId) return;
      state(e.message.toLowerCase().includes('no results') ? '🔍' : '⚠️', e.message, !e.message.toLowerCase().includes('no results'));
    }finally{
      if(my === reqId){ go.disabled = false; go.textContent = 'Search'; }
    }
  }

  form.addEventListener('submit', e => { e.preventDefault(); search(); q.blur(); });

  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if(!b || b.dataset.site === site) return;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === b));
    site = b.dataset.site; reqId++; lastResults = null;
    q.placeholder = META[site].ph; hint.innerHTML = META[site].hint;
    go.disabled = false; go.textContent = 'Search';
    out.innerHTML = '';
    if(q.value.trim()) search(); else q.focus();
  });

  state('🎧', 'Search something to get started.');
})();
</script>
</body>
</html>
